name: New Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-java:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Build and Push Docker Image
      uses: mr-smithers-excellent/docker-build-push@v4
      with:
        image: asafsamuel/workflow-test
        tag: latest
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Scan Image with kernel-headers 5.10.199
      run: |
        cat > Dockerfile.kernel-headers <<'EOF'
        FROM amazonlinux:2
        RUN yum install -y yum-utils \
            && amazon-linux-extras enable corretto8 kernel-5.10 \
            && yum clean metadata \
            && yum install -y java-1.8.0-amazon-corretto "kernel-headers-5.10.199*" \
            && yum clean all && rm -rf /var/cache/yum
        WORKDIR /usr/app
        COPY ./build/libs/*.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "app.jar"]
        EOF
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login docker.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker build -f Dockerfile.kernel-headers -t asafsamuel/workflow-test:latest4 .
        docker push asafsamuel/workflow-test:latest4

  mint:
    runs-on: ubuntu-latest
    needs: build-java

    container:
      image: registry.sweet.security/sweetsca:prod

    steps:
      - name: Run SweetSCA
        run: sweetsca registry:asafsamuel/workflow-test:latest4 --sweet-api-key=adced49e-8652-4972-82c6-c5de6639609c --sweet-env=dev --sweet-subenv=mintv2v3 -vv
