name: My Life Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    
jobs:
  mint:
    runs-on: ubuntu-latest

    container:
      image: registry.sweet.security/sweetsca:dev-refactor
    
    env:
      SWEET_API_KEY: ${{ secrets.SWEET_API_KEY }}
      SWEET_SECRET: ${{ secrets.SWEET_SECRET }}
      SWEET_ENV: dev
      SWEET_SUVENV: leakyupgrade

    steps:
      - name: Run Mint
        run: sweetsca -vv registry.k8s.io/ingress-nginx/controller:v1.14.1
      
