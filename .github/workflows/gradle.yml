name: My Life Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    
jobs:
  mint:
    runs-on: ubuntu-latest

    container:
      image: registry.sweet.security/mint:dev-v2
    
    env:
      SWEET_API_KEY: 6fd3aa9d-56f1-4654-992e-0c1da7fbc7ae
      SWEET_SECRET: ${{ secrets.SWEET_SECRET }}
      SWEET_ENV: stg

    steps:
      - name: Run Mint
        run: mint -vv registry.k8s.io/ingress-nginx/controller:v1.14.1
      
