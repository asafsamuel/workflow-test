name: My Life Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    
jobs:
  mint:
    runs-on: ubuntu-latest

    container:
      image: registry.sweet.security/mint:dev-v2
    
    env:
      SWEET_API_KEY: ${{ secrets.SWEET_API_KEY }}
      SWEET_SECRET: ${{ secrets.SWEET_SECRET }}
      SWEET_ENV: dev
      SWEET_SUBENV: mintv2v2

    steps:
      - name: Run Mint
        run: mint -vv registry.k8s.io/ingress-nginx/controller:v1.14.1
      - name: Run Mint 2
        run: mint -vv registry.k8s.io/ingress-nginx/controller:v1.12.0
      
