name: New Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    
jobs:
  build-java:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2

    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Build and Push Docker Image
      uses: mr-smithers-excellent/docker-build-push@v4
      with:
        image: asafsamuel/workflow-test
        tag: latest
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
  
  mint:
    runs-on: ubuntu-latest
    needs: build-java

    container:
      image: registry.sweet.security/sweetsca:prod

    steps:
      - name: Run SweetSCA
        run: sweetsca registry:asafsamuel/workflow-test:latest4 --sweet-api-key=adced49e-8652-4972-82c6-c5de6639609c --sweet-env=dev --sweet-subenv=mintv2v3 -vv
