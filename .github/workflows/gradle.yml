name: My Life Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    
jobs:
  mint:
    runs-on: ubuntu-latest

    container:
      image: registry.sweet.security/mint:stg
    
    env:
      SWEET_API_KEY: ${{ secrets.SWEET_KEY_API }}
      SWEET_SECRET: ${{ secrets.SWEET_SECRET }}
      SWEET_ENV: stg

    steps:
      - name: Run Mint
        run: mint -vv registry.k8s.io/ingress-nginx/controller:v1.14.1
      
